name: 'Discord Progress Updater'
description: 'Send live progress updates to a Discord Webhook'

inputs:
  webhook_url:
    description: 'Discord webhook URL'
    required: true
  message:
    description: 'Message to display'
    required: true
  progress:
    description: 'Progress string (e.g. 50%)'
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        # Generate visual progress bar
        PERCENTAGE=$(echo "${{ inputs.progress }}" | tr -dc '0-9')
        if [ -z "$PERCENTAGE" ]; then PERCENTAGE=0; fi
        if [ "$PERCENTAGE" -gt 100 ]; then PERCENTAGE=100; fi
        
        FILLED=$(($PERCENTAGE / 10))
        EMPTY=$((10 - $FILLED))
        
        BAR="["
        for ((i=0; i<FILLED; i++)); do BAR="${BAR}█"; done
        for ((i=0; i<EMPTY; i++)); do BAR="${BAR}░"; done
        BAR="${BAR}] ${PERCENTAGE}%"

        WORKFLOW="${{ github.workflow }}"
        BRANCH="${GITHUB_REF#refs/heads/}"
        REPO="${GITHUB_REPOSITORY}"
        URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        curl -sS -H "Content-Type: application/json" \
          -d "$(cat <<-ENDJSON
        {
          "embeds": [{
            "title": "⏳ Progress Update: ${WORKFLOW}",
            "description": "**${BAR}**\n\n${{ inputs.message }}\n\n**[🔍 View Live Logs](${URL})**",
            "color": 3447003,
            "fields": [
              {"name": "Branch", "value": "${BRANCH}", "inline": true},
              {"name": "Repo", "value": "${REPO}", "inline": true}
            ]
          }]
        }
        ENDJSON
        )" \
          "${{ inputs.webhook_url }}"
