name: Light-Story Test Matrix CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix packages/ui run test:unit

  server-security:
    runs-on: ubuntu-latest
    needs: ui-unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix frontend run test:security

  e2e-comic:
    runs-on: ubuntu-latest
    needs: server-security
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix frontend run test:e2e:comic-upload

  full-stack:
    runs-on: ubuntu-latest
    needs: e2e-comic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ci:full
