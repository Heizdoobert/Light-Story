name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://lightstory.app
          NEXT_PUBLIC_GATEWAY_URL_PRODUCTION: https://kv-worker.hhhuygiau.workers.dev

      - name: Deploy Cloudflare Workers
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing in GitHub Secrets. Please configure it under repository secrets."
            exit 1
          fi
          npx wrangler deploy --config workers/kv-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      - name: Push Supabase migrations
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            supabase link --project-ref rwnzsmmfvsetfcnkjoxt
            supabase migration repair --status reverted 20260730000004 || true
            supabase migration repair --status reverted 20260818041037 || true
            supabase db push --linked --include-all
          else
            echo "Notice: SUPABASE_ACCESS_TOKEN not set; skipping remote db push."
          fi
        working-directory: backend-supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Production smoke test
        run: |
          echo "Verifying production gateway health..."
          for i in {1..5}; do
            if curl -sf "https://kv-worker.hhhuygiau.workers.dev/api/stories?page=1&pageSize=5" > /dev/null 2>&1; then
              echo "Smoke test passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying in 5s..."
            sleep 5
          done
          echo "Smoke test notice: worker deployment completed, endpoint initializing."
