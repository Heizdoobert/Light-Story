name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Lint Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://lightstory.app
          NEXT_PUBLIC_GATEWAY_URL_PRODUCTION: https://kv-worker.hhhuygiau.workers.dev

      - name: Test
        run: npm run test:run

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare token scopes
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing in repository secrets"
            exit 1
          fi
          ACCOUNT_OPT=""
          if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            ACCOUNT_OPT="--account-id ${CLOUDFLARE_ACCOUNT_ID}"
          fi
          if ! npx wrangler whoami $ACCOUNT_OPT; then
            echo "::error::CLOUDFLARE_API_TOKEN missing or lacks required scopes"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Workers
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi
          ACCOUNT_OPT=""
          if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            ACCOUNT_OPT="--account-id ${CLOUDFLARE_ACCOUNT_ID}"
          fi
          npx wrangler deploy --config workers/kv-worker/wrangler.jsonc $ACCOUNT_OPT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: latest

      - name: Push Supabase migrations
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          supabase link --project-ref rwnzsmmfvsetfcnkjoxt
          supabase migration repair --status reverted 20260730000004 || true
          supabase migration repair --status reverted 20260818041037 || true
          supabase db push --linked --include-all
        working-directory: backend-supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Smoke test
        run: |
          for i in {1..10}; do
            resp=$(curl -sf -o /dev/null -w "%{http_code}" "https://kv-worker.hhhuygiau.workers.dev/api/stories?page=1&pageSize=5")
            if [ "$resp" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i/10 failed (status $resp), retrying..."
            sleep $((5 * 2 ** (i-1)))
          done
          echo "::error::Smoke test failed after all retries"
          exit 1

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d '{"content":"Deployment to production failed!"}' \
            ${{ secrets.DISCORD_WEBHOOK }}



