name: generate-sdk

on:
  push:
    paths:
      - 'packages/sdk/**'
    branches:
      - "**"
  pull_request:
    paths:
      - 'packages/sdk/**'
    branches:
      - main

jobs:
  generate-sdk:
    name: Generate SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run SDK generator
        run: npx tsx src/cli/generate-sdk.ts || true
      - name: Verify deterministic generation
        run: |
          git diff --exit-code || (echo "Generated files changed!" && exit 1)
