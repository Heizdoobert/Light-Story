name: Supabase Database Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  database-tests:
    name: Database Migrations and pgTAP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Docker Daemon
        run: |
          sudo systemctl start docker

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Start Supabase Local Stack
        working-directory: backend-supabase
        timeout-minutes: 15
        run: |
          supabase start

      - name: Run pgTAP SQL Tests
        working-directory: backend-supabase
        timeout-minutes: 10
        run: |
          supabase test db

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Run Node.js RLS Integration Tests
        run: |
          cd backend-supabase
          # supabase test db stops non-DB services; restart them for the API
          supabase start -x studio,imgproxy,logflare,mailpit,analytics,vector > /dev/null 2>&1
          eval "$(supabase status -o env)"
          if [ -z "${ANON_KEY:-}" ]; then
            echo "::error::supabase status did not export ANON_KEY"
            supabase status -o env
            exit 1
          fi
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          node supabase/tests/rls-integration.test.js
