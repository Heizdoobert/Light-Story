name: Worker E2E Smoke Tests

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  worker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm install

      - name: Start wrangler dev
        run: |
          npx wrangler dev --config workers/kv-worker/wrangler.jsonc --port 8787 > /tmp/wrangler.log 2>&1 &
          echo "Waiting for worker to start..."
          for i in $(seq 1 45); do
            if curl -s -o /dev/null "http://localhost:8787/api/health" > /dev/null 2>&1; then
              echo "Worker started after ${i} attempts."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Wrangler dev did not start within 90s"
          tail -50 /tmp/wrangler.log
          exit 1
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: dummy_key
          SUPABASE_JWKS_URL: https://example.supabase.co/auth/v1/.well-known/jwks.json

      - name: Test /api/health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8787/api/health")
          echo "GET /api/health -> $code"
          [ "$code" = "200" ] || {
            echo "::error::GET /api/health returned $code, expected 200"
            exit 1
          }

      - name: Test /api/stories
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8787/api/stories?page=1&pageSize=3")
          echo "GET /api/stories -> $code"
          [ "$code" != "000" ] || {
            echo "::error::GET /api/stories failed: worker unreachable"
            exit 1
          }

      - name: Test /api/supabase/categories
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8787/api/supabase/categories?select=*")
          echo "GET /api/supabase/categories -> $code"
          [ "$code" != "000" ] || {
            echo "::error::Supabase proxy route failed: worker unreachable"
            exit 1
          }
