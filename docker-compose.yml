name: light-story

services:
  light-story:
    build:
      context: .
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL}
        NEXT_PUBLIC_GATEWAY_URL_PRODUCTION: ${NEXT_PUBLIC_GATEWAY_URL_PRODUCTION:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_ENC_KEY: ${NEXT_PUBLIC_ENC_KEY}
    container_name: light-story
    init: true
    env_file:
      - docker-local.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
      - "8787:8787"
    volumes:
      - ./workers/kv-worker/.env:/gateway-app/workers/kv-worker/.env:ro
      - pgdata:/pgdata
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
