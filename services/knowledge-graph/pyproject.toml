[project]
name = "knowledge-graph"
version = "0.1.0"
description = "Incremental Knowledge Graph pipeline for Light Story using CocoIndex v1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cocoindex>=1.0.0",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "pydantic>=2.6.0",
    "asyncpg>=0.29.0",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
